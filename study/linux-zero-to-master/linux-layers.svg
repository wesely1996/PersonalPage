<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Where Linux actually lives</title>
  <desc id="d">Layer stack: applications and libraries in user space, the system call interface as the only door, the Linux kernel with scheduler, memory, VFS, network and drivers subsystems, and hardware at the bottom.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Where Linux actually lives</text>

    <rect x="40" y="56" width="560" height="62" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="56" y="80" font-size="15" font-weight="bold" fill="#00ff41">Applications</text>
    <text x="56" y="102" font-size="13" fill="#d8ffd8">bash, vim, nginx, python, firefox, docker CLI</text>

    <rect x="40" y="130" width="560" height="62" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="56" y="154" font-size="15" font-weight="bold" fill="#00ff41">Libraries + core utilities</text>
    <text x="56" y="176" font-size="13" fill="#d8ffd8">glibc or musl, coreutils, systemd, openssl</text>

    <rect x="40" y="204" width="560" height="50" rx="6" fill="#020a02" stroke="#ffb000" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="56" y="225" font-size="15" font-weight="bold" fill="#ffb000">System call interface</text>
    <text x="56" y="244" font-size="13" fill="#d8ffd8">read write openat clone execve mmap ioctl ...</text>

    <rect x="40" y="266" width="560" height="150" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <text x="56" y="290" font-size="15" font-weight="bold" fill="#00ff41">Linux kernel (one program, full privilege)</text>

    <g font-size="13" text-anchor="middle">
      <rect x="55" y="304" width="98" height="96" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="104" y="336" fill="#00ff41" font-weight="bold">Scheduler</text>
      <text x="104" y="358" fill="#7fbf8f">processes</text>
      <text x="104" y="378" fill="#7fbf8f">threads</text>

      <rect x="163" y="304" width="98" height="96" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="212" y="336" fill="#00ff41" font-weight="bold">Memory</text>
      <text x="212" y="358" fill="#7fbf8f">virtual mem</text>
      <text x="212" y="378" fill="#7fbf8f">page cache</text>

      <rect x="271" y="304" width="98" height="96" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="320" y="336" fill="#00ff41" font-weight="bold">VFS</text>
      <text x="320" y="358" fill="#7fbf8f">ext4, xfs</text>
      <text x="320" y="378" fill="#7fbf8f">btrfs, proc</text>

      <rect x="379" y="304" width="98" height="96" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="428" y="336" fill="#00ff41" font-weight="bold">Network</text>
      <text x="428" y="358" fill="#7fbf8f">TCP/IP</text>
      <text x="428" y="378" fill="#7fbf8f">netfilter</text>

      <rect x="487" y="304" width="98" height="96" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="536" y="336" fill="#00ff41" font-weight="bold">Drivers</text>
      <text x="536" y="358" fill="#7fbf8f">NVMe, USB</text>
      <text x="536" y="378" fill="#7fbf8f">GPU, NIC</text>
    </g>

    <rect x="40" y="430" width="560" height="50" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="320" y="460" text-anchor="middle" font-size="14" fill="#7fbf8f">Hardware: CPU, RAM, disks, NICs, GPU</text>

    <path d="M612 56 H620 V192 H612" fill="none" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="630" y="112" font-size="15" font-weight="bold" fill="#39e6ff">USER SPACE</text>
    <text x="630" y="132" font-size="13" fill="#7fbf8f">unprivileged,</text>
    <text x="630" y="150" font-size="13" fill="#7fbf8f">no direct HW</text>

    <text x="630" y="225" font-size="14" font-weight="bold" fill="#ffb000">the only door</text>
    <text x="630" y="244" font-size="13" fill="#7fbf8f">between worlds</text>

    <path d="M612 266 H620 V416 H612" fill="none" stroke="#00ff41" stroke-width="1.5"/>
    <text x="630" y="326" font-size="15" font-weight="bold" fill="#00ff41">KERNEL SPACE</text>
    <text x="630" y="346" font-size="13" fill="#7fbf8f">privileged CPU</text>
    <text x="630" y="364" font-size="13" fill="#7fbf8f">mode, owns HW</text>

    <text x="400" y="506" text-anchor="middle" font-size="13" fill="#d8ffd8">Distribution = kernel + userland + package manager + defaults</text>
  </g>
</svg>
