<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">Hiragana gojuon chart</title>
  <desc id="d">The 46 basic hiragana arranged in the traditional grid: columns are consonants (none, k, s, t, n, h, m, y, r, w, and the syllabic n), rows are the vowels a, i, u, e, o. Irregular readings shi, chi, tsu, fu, wo and n are highlighted, with notes on dakuten and handakuten.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
