    <g font-size="13" fill="#d8ffd8">
      <text x="40" y="452"><tspan fill="#ffb000">Amber</tspan> = irregular reading. <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">を</tspan> (said "o") is only the object particle.</text>
      <text x="40" y="474">As particles <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">は</tspan> reads "wa", <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">へ</tspan> reads "e". Dashed cells (yi, ye, wu, wi, we) are unused.</text>
    </g>
    <g font-size="13" fill="#d8ffd8">
      <text x="40" y="504">Dakuten <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif" fill="#00ff41">゛</tspan> voices a column:  k→g  s→z  t→d  h→b     e.g. <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif" fill="#00ff41">か→が  さ→ざ  た→だ  は→ば</tspan></text>
      <text x="40" y="528">Handakuten <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif" fill="#00ff41">゜</tspan> turns h into p:  <tspan font-family="'Courier New', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif" fill="#00ff41">は→ぱ  ひ→ぴ  ふ→ぷ  へ→ぺ  ほ→ぽ</tspan></text>
