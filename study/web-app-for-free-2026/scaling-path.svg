<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="'Courier New', monospace">
<title id="t">Scaling path beyond the free tier</title>
<desc id="d">Timeline of five stages from a zero-dollar prototype through a custom domain, paid edge compute, a paid database plan and larger-scale architecture, with the trigger for each step.</desc>
<rect width="100%" height="100%" fill="#020a02"/>
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39e6ff"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a2a"/></marker>
</defs>
<text x="400" y="34" font-size="20" fill="#00ff41" text-anchor="middle" font-weight="bold" filter="url(#glow)">SCALING PATH: WHEN TO START PAYING</text>
<text x="400" y="56" font-size="13" fill="#7fbf8f" text-anchor="middle">upgrade one bottleneck at a time, triggered by evidence</text>
<line x1="40" y1="110" x2="760" y2="110" stroke="#0f7a2a" stroke-width="2"/>
<circle cx="92" cy="110" r="8" fill="#020a02" stroke="#00ff41" stroke-width="2"/>
<text x="92" y="90" font-size="14" fill="#00ff41" text-anchor="middle" font-weight="bold">STAGE 0</text>
<rect x="20" y="135" width="144" height="140" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="92" y="159" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">$0</text>
<text x="92" y="187" font-size="13" fill="#d8ffd8" text-anchor="middle">free tiers</text>
<text x="92" y="209" font-size="13" fill="#d8ffd8" text-anchor="middle">workers.dev</text>
<text x="92" y="231" font-size="13" fill="#d8ffd8" text-anchor="middle">subdomain</text>
<text x="92" y="305" font-size="13" fill="#7fbf8f" text-anchor="middle">move on when</text>
<text x="92" y="327" font-size="13" fill="#ffb000" text-anchor="middle">you and a</text>
<text x="92" y="347" font-size="13" fill="#ffb000" text-anchor="middle">few friends</text>
<circle cx="246" cy="110" r="8" fill="#020a02" stroke="#39e6ff" stroke-width="2"/>
<text x="246" y="90" font-size="14" fill="#39e6ff" text-anchor="middle" font-weight="bold">STAGE 1</text>
<rect x="174" y="135" width="144" height="140" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
<text x="246" y="159" font-size="15" fill="#39e6ff" text-anchor="middle" font-weight="bold">~$10-15/yr</text>
<text x="246" y="187" font-size="13" fill="#d8ffd8" text-anchor="middle">own domain</text>
<text x="246" y="209" font-size="13" fill="#d8ffd8" text-anchor="middle">same free</text>
<text x="246" y="231" font-size="13" fill="#d8ffd8" text-anchor="middle">stack</text>
<text x="246" y="305" font-size="13" fill="#7fbf8f" text-anchor="middle">move on when</text>
<text x="246" y="327" font-size="13" fill="#ffb000" text-anchor="middle">you share</text>
<text x="246" y="347" font-size="13" fill="#ffb000" text-anchor="middle">it publicly</text>
<circle cx="400" cy="110" r="8" fill="#020a02" stroke="#39e6ff" stroke-width="2"/>
<text x="400" y="90" font-size="14" fill="#39e6ff" text-anchor="middle" font-weight="bold">STAGE 2</text>
<rect x="328" y="135" width="144" height="140" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
<text x="400" y="159" font-size="15" fill="#39e6ff" text-anchor="middle" font-weight="bold">~$5/mo</text>
<text x="400" y="187" font-size="13" fill="#d8ffd8" text-anchor="middle">Workers Paid</text>
<text x="400" y="209" font-size="13" fill="#d8ffd8" text-anchor="middle">higher limits</text>
<text x="400" y="231" font-size="13" fill="#d8ffd8" text-anchor="middle">more CPU</text>
<text x="400" y="305" font-size="13" fill="#7fbf8f" text-anchor="middle">move on when</text>
<text x="400" y="327" font-size="13" fill="#ffb000" text-anchor="middle">near 100k</text>
<text x="400" y="347" font-size="13" fill="#ffb000" text-anchor="middle">requests/day</text>
<circle cx="554" cy="110" r="8" fill="#020a02" stroke="#ffb000" stroke-width="2"/>
<text x="554" y="90" font-size="14" fill="#ffb000" text-anchor="middle" font-weight="bold">STAGE 3</text>
<rect x="482" y="135" width="144" height="140" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
<text x="554" y="159" font-size="15" fill="#ffb000" text-anchor="middle" font-weight="bold">~$25/mo</text>
<text x="554" y="187" font-size="13" fill="#d8ffd8" text-anchor="middle">Supabase Pro</text>
<text x="554" y="209" font-size="13" fill="#d8ffd8" text-anchor="middle">no pausing</text>
<text x="554" y="231" font-size="13" fill="#d8ffd8" text-anchor="middle">daily backups</text>
<text x="554" y="305" font-size="13" fill="#7fbf8f" text-anchor="middle">move on when</text>
<text x="554" y="327" font-size="13" fill="#ffb000" text-anchor="middle">real users,</text>
<text x="554" y="347" font-size="13" fill="#ffb000" text-anchor="middle">data matters</text>
<circle cx="708" cy="110" r="8" fill="#020a02" stroke="#ffb000" stroke-width="2"/>
<text x="708" y="90" font-size="14" fill="#ffb000" text-anchor="middle" font-weight="bold">STAGE 4</text>
<rect x="636" y="135" width="144" height="140" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
<text x="708" y="159" font-size="15" fill="#ffb000" text-anchor="middle" font-weight="bold">usage-based</text>
<text x="708" y="187" font-size="13" fill="#d8ffd8" text-anchor="middle">replicas,</text>
<text x="708" y="209" font-size="13" fill="#d8ffd8" text-anchor="middle">queues, cache</text>
<text x="708" y="231" font-size="13" fill="#d8ffd8" text-anchor="middle">team plans</text>
<text x="708" y="305" font-size="13" fill="#7fbf8f" text-anchor="middle">move on when</text>
<text x="708" y="327" font-size="13" fill="#ffb000" text-anchor="middle">revenue pays</text>
<text x="708" y="347" font-size="13" fill="#ffb000" text-anchor="middle">for it</text>
<rect x="20" y="380" width="760" height="44" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
<text x="400" y="407" font-size="13" fill="#7fbf8f" text-anchor="middle">prices are approximate, at the time of writing (2026)</text>
</svg>
