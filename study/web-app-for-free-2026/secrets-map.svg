<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="'Courier New', monospace">
<title id="t">Where each config value lives</title>
<desc id="d">Three columns show public build-time variables, Worker runtime variables, and GitHub Actions secrets for the example app, plus files that must never be committed.</desc>
<rect width="100%" height="100%" fill="#020a02"/>
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39e6ff"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a2a"/></marker>
</defs>
<text x="400" y="34" font-size="20" fill="#00ff41" text-anchor="middle" font-weight="bold" filter="url(#glow)">WHERE EACH CONFIG VALUE LIVES</text>
<text x="400" y="56" font-size="13" fill="#7fbf8f" text-anchor="middle">public is not a dirty word; secret is not optional</text>
<rect x="20" y="76" width="246" height="250" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="143" y="100" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">PUBLIC (JS BUNDLE)</text>
<text x="143" y="120" font-size="13" fill="#7fbf8f" text-anchor="middle">anyone can read these</text>
<text x="28" y="152" font-size="13" fill="#d8ffd8">VITE_SUPABASE_URL</text>
<text x="28" y="178" font-size="13" fill="#d8ffd8">VITE_SUPABASE_PUBLISHABLE_KEY</text>
<text x="28" y="204" font-size="13" fill="#d8ffd8">VITE_SENTRY_DSN</text>
<text x="28" y="256" font-size="13" fill="#7fbf8f">safe ONLY because RLS</text>
<text x="28" y="282" font-size="13" fill="#7fbf8f">guards every table</text>
<rect x="277" y="76" width="246" height="250" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
<text x="400" y="100" font-size="15" fill="#39e6ff" text-anchor="middle" font-weight="bold">WORKER RUNTIME</text>
<text x="400" y="120" font-size="13" fill="#7fbf8f" text-anchor="middle">wrangler vars / secrets</text>
<text x="285" y="152" font-size="13" fill="#d8ffd8">SUPABASE_URL</text>
<text x="285" y="178" font-size="13" fill="#d8ffd8">SUPABASE_PUBLISHABLE_KEY</text>
<text x="285" y="204" font-size="13" fill="#d8ffd8">plain vars in wrangler</text>
<text x="285" y="230" font-size="13" fill="#d8ffd8">local copy: .dev.vars</text>
<text x="285" y="256" font-size="13" fill="#7fbf8f">no service key needed:</text>
<text x="285" y="282" font-size="13" fill="#7fbf8f">the user JWT is enough</text>
<rect x="534" y="76" width="246" height="250" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
<text x="657" y="100" font-size="15" fill="#ffb000" text-anchor="middle" font-weight="bold">CI (GITHUB SECRETS)</text>
<text x="657" y="120" font-size="13" fill="#7fbf8f" text-anchor="middle">Settings &gt; Secrets &gt; Actions</text>
<text x="542" y="152" font-size="13" fill="#d8ffd8">CLOUDFLARE_API_TOKEN</text>
<text x="542" y="178" font-size="13" fill="#d8ffd8">CLOUDFLARE_ACCOUNT_ID</text>
<text x="542" y="204" font-size="13" fill="#d8ffd8">SUPABASE_ACCESS_TOKEN</text>
<text x="542" y="230" font-size="13" fill="#d8ffd8">SUPABASE_DB_PASSWORD</text>
<text x="542" y="256" font-size="13" fill="#d8ffd8">SUPABASE_PROJECT_ID</text>
<text x="542" y="282" font-size="13" fill="#d8ffd8">scoped, rotatable</text>
<rect x="20" y="350" width="760" height="100" rx="6" fill="#020a02" stroke="#ff4d4d" stroke-width="1.5"/>
<text x="400" y="376" font-size="15" fill="#ff4d4d" text-anchor="middle" font-weight="bold">NEVER COMMIT</text>
<text x="400" y="400" font-size="13" fill="#d8ffd8" text-anchor="middle">.env.local | .dev.vars | sb_secret_* keys | DB passwords | tokens</text>
<text x="400" y="424" font-size="13" fill="#7fbf8f" text-anchor="middle">add them to .gitignore; if one leaks, rotate it - deleting the commit is not enough</text>
</svg>
