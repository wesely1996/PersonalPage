<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="'Courier New', monospace">
<title id="t">The journey of one request</title>
<desc id="d">A browser resolves the domain via DNS, fetches static files from a CDN edge over HTTPS, then calls an API worker which queries Postgres; numbered steps explain each hop.</desc>
<rect width="100%" height="100%" fill="#020a02"/>
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39e6ff"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a2a"/></marker>
</defs>
<text x="400" y="34" font-size="20" fill="#00ff41" text-anchor="middle" font-weight="bold" filter="url(#glow)">THE JOURNEY OF ONE REQUEST</text>
<text x="400" y="56" font-size="13" fill="#7fbf8f" text-anchor="middle">what happens between "Enter" and a rendered page</text>
<rect x="20" y="80" width="150" height="210" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="95" y="104" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">BROWSER</text>
<text x="95" y="126" font-size="13" fill="#d8ffd8" text-anchor="middle">you type the</text>
<text x="95" y="145" font-size="13" fill="#d8ffd8" text-anchor="middle">URL; later it</text>
<text x="95" y="164" font-size="13" fill="#d8ffd8" text-anchor="middle">runs the JS</text>
<text x="95" y="183" font-size="13" fill="#d8ffd8" text-anchor="middle">and renders</text>
<text x="95" y="202" font-size="13" fill="#d8ffd8" text-anchor="middle">the page</text>
<rect x="250" y="80" width="140" height="80" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="320" y="104" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">DNS</text>
<text x="320" y="126" font-size="13" fill="#d8ffd8" text-anchor="middle">name -&gt; IP</text>
<rect x="250" y="200" width="140" height="90" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="320" y="224" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">CDN EDGE</text>
<text x="320" y="246" font-size="13" fill="#d8ffd8" text-anchor="middle">TLS + cache</text>
<text x="320" y="265" font-size="13" fill="#d8ffd8" text-anchor="middle">static files</text>
<rect x="460" y="200" width="130" height="90" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="525" y="224" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">API</text>
<text x="525" y="246" font-size="13" fill="#d8ffd8" text-anchor="middle">your server</text>
<text x="525" y="265" font-size="13" fill="#d8ffd8" text-anchor="middle">code runs</text>
<rect x="660" y="200" width="120" height="90" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
<text x="720" y="224" font-size="15" fill="#00ff41" text-anchor="middle" font-weight="bold">POSTGRES</text>
<text x="720" y="246" font-size="13" fill="#d8ffd8" text-anchor="middle">rows + RLS</text>
<text x="720" y="265" font-size="13" fill="#d8ffd8" text-anchor="middle">live here</text>
<line x1="170" y1="105" x2="248" y2="105" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="209" y="99" font-size="13" fill="#7fbf8f" text-anchor="middle">1 name?</text>
<line x1="250" y1="135" x2="172" y2="135" stroke="#39e6ff" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="209" y="152" font-size="13" fill="#39e6ff" text-anchor="middle">2 IP</text>
<line x1="170" y1="225" x2="248" y2="225" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="209" y="219" font-size="13" fill="#7fbf8f" text-anchor="middle">3 GET</text>
<line x1="250" y1="265" x2="172" y2="265" stroke="#39e6ff" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="209" y="282" font-size="13" fill="#39e6ff" text-anchor="middle">files</text>
<line x1="390" y1="235" x2="458" y2="235" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="424" y="229" font-size="13" fill="#7fbf8f" text-anchor="middle">4 /api</text>
<line x1="590" y1="235" x2="658" y2="235" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="624" y="229" font-size="13" fill="#7fbf8f" text-anchor="middle">5 SQL</text>
<line x1="658" y1="265" x2="592" y2="265" stroke="#39e6ff" stroke-width="1.6" marker-end="url(#ac)"/>
<line x1="458" y1="265" x2="392" y2="265" stroke="#39e6ff" stroke-width="1.6" marker-end="url(#ac)"/>
<text x="424" y="282" font-size="13" fill="#39e6ff" text-anchor="middle">6 JSON</text>
<text x="624" y="282" font-size="13" fill="#39e6ff" text-anchor="middle">rows</text>
<rect x="20" y="315" width="760" height="140" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
<text x="36" y="340" font-size="13" fill="#d8ffd8">1  Browser asks DNS: which IP serves notes.example.dev?</text>
<text x="36" y="360" font-size="13" fill="#7fbf8f">2  DNS answers with an address of a nearby CDN edge (cached for its TTL)</text>
<text x="36" y="380" font-size="13" fill="#d8ffd8">3  TLS handshake, then GET / -&gt; index.html + JS bundle, served from cache</text>
<text x="36" y="400" font-size="13" fill="#7fbf8f">4  The JS runs in the browser and calls /api/... with a login token</text>
<text x="36" y="420" font-size="13" fill="#d8ffd8">5  Server code checks the token and queries the database</text>
<text x="36" y="440" font-size="13" fill="#7fbf8f">6  Data flows back as JSON; the browser re-renders. Total: often &lt; 300 ms</text>
</svg>
