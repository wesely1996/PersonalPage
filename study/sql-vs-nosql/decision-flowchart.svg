<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 648" role="img" aria-labelledby="t d">
  <title id="t">Database decision flowchart</title>
  <desc id="d">A top-down flowchart. Ask in order: is it a system of record needing cross-entity invariants and ad-hoc queries (relational); only key lookups at huge scale or sub-millisecond latency (key-value); a write-heavy firehose with known queries (wide-column); multi-hop traversals (graph); time buckets, text relevance or similarity (time-series, search or vector); self-contained aggregates read whole (document). If none apply, start with PostgreSQL.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fbf8f"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#00ff41" filter="url(#glow)">WHICH DATABASE? A FIRST PASS</text>
    <rect x="145" y="46" width="200" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
    <text x="245" y="68" text-anchor="middle" font-size="14" fill="#d8ffd8">START HERE</text>
    <line x1="245" y1="80" x2="245" y2="107" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="365" y="68" font-size="13" fill="#7fbf8f">ask in order; first yes wins</text>
    <rect x="20" y="110" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="134" font-size="14" fill="#d8ffd8">System of record: invariants across</text>
    <text x="35" y="154" font-size="14" fill="#d8ffd8">entities, joins, ad-hoc reporting?</text>
    <line x1="470" y1="139" x2="538" y2="139" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="132" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="110" width="240" height="58" rx="6" fill="#020a02" stroke="#00ff41" stroke-width="2"/>
    <text x="552" y="128" font-size="13" font-weight="bold" fill="#00ff41">RELATIONAL</text>
    <text x="552" y="145" font-size="13" fill="#d8ffd8">Postgres, MySQL</text>
    <text x="552" y="162" font-size="13" fill="#7fbf8f">too big? distributed SQL</text>
    <line x1="245" y1="168" x2="245" y2="187" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="183" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="190" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="214" font-size="14" fill="#d8ffd8">Only get/put by key, at huge scale</text>
    <text x="35" y="234" font-size="14" fill="#d8ffd8">or sub-millisecond latency?</text>
    <line x1="470" y1="219" x2="538" y2="219" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="212" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="190" width="240" height="58" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="552" y="208" font-size="13" font-weight="bold" fill="#39e6ff">KEY-VALUE</text>
    <text x="552" y="225" font-size="13" fill="#d8ffd8">Redis/Valkey, DynamoDB</text>
    <text x="552" y="242" font-size="13" fill="#7fbf8f">(cache or primary store)</text>
    <line x1="245" y1="248" x2="245" y2="267" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="263" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="270" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="294" font-size="14" fill="#d8ffd8">Write-heavy firehose, many TB, queries</text>
    <text x="35" y="314" font-size="14" fill="#d8ffd8">known up front, multi-datacenter?</text>
    <line x1="470" y1="299" x2="538" y2="299" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="292" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="270" width="240" height="58" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="552" y="288" font-size="13" font-weight="bold" fill="#39e6ff">WIDE-COLUMN</text>
    <text x="552" y="305" font-size="13" fill="#d8ffd8">Cassandra, ScyllaDB</text>
    <text x="552" y="322" font-size="13" fill="#7fbf8f">(or DynamoDB)</text>
    <line x1="245" y1="328" x2="245" y2="347" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="343" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="350" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="374" font-size="14" fill="#d8ffd8">Core questions are multi-hop</text>
    <text x="35" y="394" font-size="14" fill="#d8ffd8">traversals (paths, rings, recs)?</text>
    <line x1="470" y1="379" x2="538" y2="379" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="372" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="350" width="240" height="58" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="552" y="368" font-size="13" font-weight="bold" fill="#39e6ff">GRAPH</text>
    <text x="552" y="385" font-size="13" fill="#d8ffd8">Neo4j, Neptune</text>
    <text x="552" y="402" font-size="13" fill="#7fbf8f">or recursive SQL CTEs</text>
    <line x1="245" y1="408" x2="245" y2="427" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="423" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="430" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="454" font-size="14" fill="#d8ffd8">Core query is time buckets, text</text>
    <text x="35" y="474" font-size="14" fill="#d8ffd8">relevance, or semantic similarity?</text>
    <line x1="470" y1="459" x2="538" y2="459" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="452" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="430" width="240" height="58" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="552" y="448" font-size="13" font-weight="bold" fill="#39e6ff">TIME / SEARCH / VECTOR</text>
    <text x="552" y="465" font-size="13" fill="#d8ffd8">TimescaleDB, OpenSearch,</text>
    <text x="552" y="482" font-size="13" fill="#7fbf8f">pgvector, Qdrant</text>
    <line x1="245" y1="488" x2="245" y2="507" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="503" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="510" width="450" height="58" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="35" y="534" font-size="14" fill="#d8ffd8">Self-contained aggregates, varied</text>
    <text x="35" y="554" font-size="14" fill="#d8ffd8">shape, read and written whole?</text>
    <line x1="470" y1="539" x2="538" y2="539" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="504" y="532" text-anchor="middle" font-size="13" fill="#00ff41">yes</text>
    <rect x="540" y="510" width="240" height="58" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="552" y="528" font-size="13" font-weight="bold" fill="#39e6ff">DOCUMENT</text>
    <text x="552" y="545" font-size="13" fill="#d8ffd8">MongoDB, Couchbase,</text>
    <text x="552" y="562" font-size="13" fill="#7fbf8f">or Postgres JSONB</text>
    <line x1="245" y1="568" x2="245" y2="587" stroke="#7fbf8f" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="255" y="583" font-size="13" fill="#7fbf8f">no</text>
    <rect x="20" y="590" width="760" height="44" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <text x="400" y="617" text-anchor="middle" font-size="14" fill="#00ff41">None of the above? Start with PostgreSQL and measure.</text>
  </g>
</svg>
