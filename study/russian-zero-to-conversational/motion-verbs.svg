<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Russian verbs of motion: one direction versus round trips</title>
  <desc id="d">A two by two grid. Rows: on foot and by vehicle. Columns: one direction in progress, and round trips or habits. идти: иду, идёшь, идут, a single arrow from home to school, Я иду в школу. ходить: хожу, ходишь, ходят, arrows there and back, Я хожу в школу. ехать: еду, едешь, едут, Я еду на работу. ездить: езжу, ездишь, ездят, Я езжу на работу. Footer: пойти and поехать for will go; ходил means went and came back.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', 'Noto Sans CJK SC', 'Noto Sans JP', 'Microsoft YaHei', 'Yu Gothic', sans-serif">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Going: pick the verb by the shape of the trip</text>

    <!-- column headers -->
    <text x="312" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#00ff41">ONE DIRECTION, NOW</text>
    <text x="312" y="90" text-anchor="middle" font-size="13" fill="#7fbf8f">in progress, on the way</text>
    <text x="622" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffb000">ROUND TRIPS, HABITS</text>
    <text x="622" y="90" text-anchor="middle" font-size="13" fill="#7fbf8f">there and back, regularly</text>

    <!-- row labels -->
    <rect x="20" y="104" width="130" height="150" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="85" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">ON FOOT</text>
    <rect x="20" y="268" width="130" height="150" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="85" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">BY</text>
    <text x="85" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">VEHICLE</text>

    <!-- cells -->
    <g fill="#062b0f" stroke-width="1.5">
      <rect x="165" y="104" width="295" height="150" rx="6" stroke="#00ff41"/>
      <rect x="475" y="104" width="295" height="150" rx="6" stroke="#ffb000"/>
      <rect x="165" y="268" width="295" height="150" rx="6" stroke="#00ff41"/>
      <rect x="475" y="268" width="295" height="150" rx="6" stroke="#ffb000"/>
    </g>

    <!-- идти -->
    <text x="180" y="130" font-size="18" font-weight="bold" fill="#00ff41">идти</text>
    <text x="260" y="130" font-size="13" fill="#d8ffd8">иду, идёшь, идут</text>
    <rect x="180" y="148" width="60" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="210" y="166" text-anchor="middle" font-size="13" fill="#d8ffd8">дом</text>
    <rect x="380" y="148" width="66" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="413" y="166" text-anchor="middle" font-size="13" fill="#d8ffd8">школа</text>
    <line x1="244" y1="161" x2="374" y2="161" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="210" font-size="13" fill="#d8ffd8">Я иду в школу.</text>
    <text x="180" y="230" font-size="13" fill="#7fbf8f">I am walking to school.</text>

    <!-- ходить -->
    <text x="490" y="130" font-size="18" font-weight="bold" fill="#ffb000">ходить</text>
    <text x="580" y="130" font-size="13" fill="#d8ffd8">хожу, ходишь</text>
    <rect x="490" y="148" width="60" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="520" y="166" text-anchor="middle" font-size="13" fill="#d8ffd8">дом</text>
    <rect x="690" y="148" width="66" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="723" y="166" text-anchor="middle" font-size="13" fill="#d8ffd8">школа</text>
    <line x1="554" y1="155" x2="684" y2="155" stroke="#ffb000" stroke-width="2" marker-end="url(#arra)"/>
    <line x1="684" y1="168" x2="554" y2="168" stroke="#ffb000" stroke-width="2" marker-end="url(#arra)"/>
    <text x="620" y="192" text-anchor="middle" font-size="13" fill="#7fbf8f">x every day</text>
    <text x="490" y="214" font-size="13" fill="#d8ffd8">Я хожу в школу.</text>
    <text x="490" y="234" font-size="13" fill="#7fbf8f">I go to school (regularly).</text>

    <!-- ехать -->
    <text x="180" y="294" font-size="18" font-weight="bold" fill="#00ff41">ехать</text>
    <text x="260" y="294" font-size="13" fill="#d8ffd8">еду, едешь, едут</text>
    <rect x="180" y="312" width="60" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="210" y="330" text-anchor="middle" font-size="13" fill="#d8ffd8">дом</text>
    <rect x="380" y="312" width="66" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="413" y="330" text-anchor="middle" font-size="13" fill="#d8ffd8">работа</text>
    <line x1="244" y1="325" x2="374" y2="325" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="374" font-size="13" fill="#d8ffd8">Я еду на работу.</text>
    <text x="180" y="394" font-size="13" fill="#7fbf8f">I am on my way to work.</text>

    <!-- ездить -->
    <text x="490" y="294" font-size="18" font-weight="bold" fill="#ffb000">ездить</text>
    <text x="580" y="294" font-size="13" fill="#d8ffd8">езжу, ездишь</text>
    <rect x="490" y="312" width="60" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="520" y="330" text-anchor="middle" font-size="13" fill="#d8ffd8">дом</text>
    <rect x="690" y="312" width="66" height="26" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="723" y="330" text-anchor="middle" font-size="13" fill="#d8ffd8">работа</text>
    <line x1="554" y1="319" x2="684" y2="319" stroke="#ffb000" stroke-width="2" marker-end="url(#arra)"/>
    <line x1="684" y1="332" x2="554" y2="332" stroke="#ffb000" stroke-width="2" marker-end="url(#arra)"/>
    <text x="620" y="356" text-anchor="middle" font-size="13" fill="#7fbf8f">x every day</text>
    <text x="490" y="378" font-size="13" fill="#d8ffd8">Я езжу на работу.</text>
    <text x="490" y="398" font-size="13" fill="#7fbf8f">I commute to work.</text>

    <!-- footer -->
    <text x="20" y="450" font-size="13" fill="#d8ffd8"><tspan fill="#00ff41" font-weight="bold">Will go / set off:</tspan> пойти (пойду), поехать (поеду)</text>
    <text x="20" y="474" font-size="13" fill="#d8ffd8"><tspan fill="#ffb000" font-weight="bold">Past round trip:</tspan> Вчера я ходил в кино = I went and came back.</text>
  </g>
</svg>
