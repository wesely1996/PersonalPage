<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">French object pronoun order</title>
  <desc id="d">A sentence skeleton with nine slots from left to right: subject, ne, then me te se nous vous, then le la les, then lui leur, then y, then en, then the conjugated verb or auxiliary, then pas. Examples below: Il me le donne; Je le lui ai dit; Il y en a trois; Je ne lui en ai pas parlé. In affirmative commands the pronouns move after the verb: Donne-le-moi, Vas-y.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Where object pronouns go</text>

    <!-- slots: x = 18 + i*85, width 80 -->
    <g stroke-width="1.5" fill="#062b0f">
      <rect x="18" y="60" width="80" height="170" rx="6" stroke="#0f7a2a"/>
      <rect x="103" y="60" width="80" height="170" rx="6" stroke="#ffb000"/>
      <rect x="188" y="60" width="80" height="170" rx="6" stroke="#00ff41"/>
      <rect x="273" y="60" width="80" height="170" rx="6" stroke="#00ff41"/>
      <rect x="358" y="60" width="80" height="170" rx="6" stroke="#00ff41"/>
      <rect x="443" y="60" width="80" height="170" rx="6" stroke="#00ff41"/>
      <rect x="528" y="60" width="80" height="170" rx="6" stroke="#00ff41"/>
      <rect x="613" y="60" width="80" height="170" rx="6" stroke="#0f7a2a"/>
      <rect x="698" y="60" width="80" height="170" rx="6" stroke="#ffb000"/>
    </g>
    <g font-size="13" fill="#7fbf8f" text-anchor="middle">
      <text x="58" y="82">subject</text>
      <text x="143" y="82">(neg.)</text>
      <text x="228" y="82">1</text>
      <text x="313" y="82">2</text>
      <text x="398" y="82">3</text>
      <text x="483" y="82">4</text>
      <text x="568" y="82">5</text>
      <text x="653" y="82">verb</text>
      <text x="738" y="82">(neg.)</text>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="58" y="116" fill="#d8ffd8">je</text>
      <text x="58" y="138" fill="#d8ffd8">tu</text>
      <text x="58" y="160" fill="#d8ffd8">il...</text>

      <text x="143" y="116" fill="#ffb000">ne</text>
      <text x="143" y="138" fill="#ffb000">n'</text>

      <text x="228" y="116" fill="#00ff41">me</text>
      <text x="228" y="138" fill="#00ff41">te</text>
      <text x="228" y="160" fill="#00ff41">se</text>
      <text x="228" y="182" fill="#00ff41">nous</text>
      <text x="228" y="204" fill="#00ff41">vous</text>

      <text x="313" y="116" fill="#00ff41">le</text>
      <text x="313" y="138" fill="#00ff41">la</text>
      <text x="313" y="160" fill="#00ff41">les</text>

      <text x="398" y="116" fill="#00ff41">lui</text>
      <text x="398" y="138" fill="#00ff41">leur</text>

      <text x="483" y="116" fill="#00ff41">y</text>

      <text x="568" y="116" fill="#00ff41">en</text>

      <text x="653" y="116" fill="#d8ffd8">verb</text>
      <text x="653" y="138" fill="#d8ffd8">or aux.</text>

      <text x="738" y="116" fill="#ffb000">pas</text>
      <text x="738" y="138" fill="#ffb000">jamais</text>
      <text x="738" y="160" fill="#ffb000">rien</text>
      <text x="738" y="182" fill="#ffb000">plus</text>
    </g>

    <line x1="190" y1="246" x2="606" y2="246" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="398" y="266" text-anchor="middle" font-size="13" fill="#7fbf8f">object pronouns: always in this order, before the verb</text>

    <!-- examples -->
    <rect x="18" y="280" width="760" height="130" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <g font-size="15" fill="#d8ffd8">
      <text x="36" y="308">Il <tspan fill="#00ff41">me le</tspan> donne.</text>
      <text x="36" y="336">Je <tspan fill="#00ff41">le lui</tspan> ai dit.</text>
      <text x="36" y="364">Il <tspan fill="#00ff41">y en</tspan> a trois.</text>
      <text x="36" y="392">Je <tspan fill="#ffb000">ne</tspan> <tspan fill="#00ff41">lui en</tspan> ai <tspan fill="#ffb000">pas</tspan> parlé.</text>
    </g>
    <g font-size="13" fill="#7fbf8f">
      <text x="400" y="308">He gives it to me.</text>
      <text x="400" y="336">I told him/her (it).</text>
      <text x="400" y="364">There are three (of them).</text>
      <text x="400" y="392">I didn't talk to him/her about it.</text>
    </g>

    <text x="400" y="438" text-anchor="middle" font-size="14" fill="#ffb000">Affirmative commands only: pronouns after the verb. Donne-le-moi ! Vas-y !</text>
  </g>
</svg>
