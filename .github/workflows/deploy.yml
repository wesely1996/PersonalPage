name: Deploy

# A merged PR lands as a push to master, so that's the trigger. Pushing the
# release tag below does not re-trigger this (a tag push isn't a push to the
# master branch ref), so there is no risk of looping.
on:
  push:
    branches: [master]

permissions:
  contents: write

# Serialize deploys/tags so two merges close together can't race each other.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the tag action can see prior tags

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build (production)
        run: npx ng build --configuration production --base-href "https://wesely1996.github.io/PersonalPage/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/personal-page/browser
          publish_branch: gh-pages

      # Bumps and pushes a semver tag from conventional commit messages
      # since the last tag: "feat:" -> minor, "fix:"/other -> patch,
      # "BREAKING CHANGE" -> major.
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v13
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub release
        if: steps.tag_version.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
