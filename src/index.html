<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages, MIT License
      // https://github.com/rafgraph/spa-github-pages
      //
      // Paired with public/404.html: if that page redirected a deep link
      // here (path encoded into "?/..."), decode it and restore it with
      // history.replaceState before Angular Router initializes below, so
      // the app boots straight into the originally requested route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <meta charset="utf-8"/>
    <title>Nikola Veselinović</title>
    <base href="/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
