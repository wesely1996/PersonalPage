<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">French vowel map: oral and nasal vowels</title>
  <desc id="d">Left: a vowel chart placing French oral vowels by tongue position, front to back and close to open, with example words; the rounded front vowels u, eu (deux) and eu (peur) are highlighted as new sounds for English speakers. Right: the four nasal vowels with their spellings, example words and approximate sounds, plus the rule that n or m followed by a vowel or doubled cancels nasality.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">French vowels: the new territory</text>

    <!-- Oral vowel panel -->
    <rect x="20" y="52" width="470" height="460" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="40" y="78" font-size="15" font-weight="bold" fill="#00ff41">ORAL VOWELS (where the tongue is)</text>
    <text x="60" y="112" font-size="13" fill="#7fbf8f">FRONT</text>
    <text x="470" y="112" text-anchor="end" font-size="13" fill="#7fbf8f">BACK</text>
    <polygon points="60,125 470,125 470,450 170,450" fill="none" stroke="#0f7a2a" stroke-width="1.5"/>
    <line x1="85" y1="245" x2="470" y2="245" stroke="#0f7a2a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="118" y1="340" x2="470" y2="340" stroke="#0f7a2a" stroke-width="1" stroke-dasharray="4 4"/>

    <g font-size="14" xml:space="preserve">
      <!-- close -->
      <circle cx="85" cy="150" r="5" fill="#00ff41"/>
      <text x="95" y="155" fill="#d8ffd8">i  si</text>
      <circle cx="205" cy="150" r="5" fill="#ffb000"/>
      <text x="215" y="155" fill="#ffb000">u  tu</text>
      <circle cx="385" cy="150" r="5" fill="#00ff41"/>
      <text x="395" y="155" fill="#d8ffd8">ou vous</text>
      <!-- close-mid -->
      <circle cx="115" cy="245" r="5" fill="#00ff41"/>
      <text x="125" y="250" fill="#d8ffd8">é  été</text>
      <circle cx="230" cy="245" r="5" fill="#ffb000"/>
      <text x="240" y="250" fill="#ffb000">eu deux</text>
      <circle cx="385" cy="245" r="5" fill="#00ff41"/>
      <text x="395" y="250" fill="#d8ffd8">o  beau</text>
      <!-- open-mid -->
      <circle cx="145" cy="340" r="5" fill="#00ff41"/>
      <text x="155" y="345" fill="#d8ffd8">è  mère</text>
      <circle cx="255" cy="340" r="5" fill="#ffb000"/>
      <text x="265" y="345" fill="#ffb000">eu peur</text>
      <circle cx="385" cy="340" r="5" fill="#00ff41"/>
      <text x="395" y="345" fill="#d8ffd8">o  porte</text>
      <!-- open -->
      <circle cx="200" cy="430" r="5" fill="#00ff41"/>
      <text x="210" y="435" fill="#d8ffd8">a  patte</text>
    </g>
    <text x="300" y="190" font-size="13" fill="#39e6ff">i → u: keep tongue,</text>
    <text x="300" y="208" font-size="13" fill="#39e6ff">round the lips</text>

    <text x="40" y="476" font-size="13" fill="#7fbf8f">top = mouth almost closed, bottom = wide open</text>
    <text x="40" y="498" font-size="13" fill="#ffb000">amber = front + rounded lips (new for English)</text>

    <!-- Nasal vowel panel -->
    <rect x="505" y="52" width="275" height="460" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="520" y="78" font-size="15" font-weight="bold" fill="#00ff41">NASAL VOWELS</text>

    <rect x="518" y="92" width="249" height="80" rx="6" fill="#020a02" stroke="#00ff41" stroke-width="1.5"/>
    <text x="530" y="116" font-size="15" font-weight="bold" fill="#00ff41">an  en  am  em</text>
    <text x="530" y="140" font-size="13" fill="#d8ffd8">enfant, temps, chambre</text>
    <text x="530" y="160" font-size="13" fill="#7fbf8f">sounds like: ah(n)</text>

    <rect x="518" y="182" width="249" height="80" rx="6" fill="#020a02" stroke="#00ff41" stroke-width="1.5"/>
    <text x="530" y="206" font-size="15" font-weight="bold" fill="#00ff41">on  om</text>
    <text x="530" y="230" font-size="13" fill="#d8ffd8">bon, nom, onze</text>
    <text x="530" y="250" font-size="13" fill="#7fbf8f">sounds like: oh(n)</text>

    <rect x="518" y="272" width="249" height="80" rx="6" fill="#020a02" stroke="#00ff41" stroke-width="1.5"/>
    <text x="530" y="296" font-size="15" font-weight="bold" fill="#00ff41">in  im  ain  ein</text>
    <text x="530" y="320" font-size="13" fill="#d8ffd8">vin, pain, plein, bien</text>
    <text x="530" y="340" font-size="13" fill="#7fbf8f">sounds like: eh(n)</text>

    <rect x="518" y="362" width="249" height="80" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="530" y="386" font-size="15" font-weight="bold" fill="#7fbf8f">un  um</text>
    <text x="530" y="410" font-size="13" fill="#d8ffd8">un, parfum</text>
    <text x="530" y="430" font-size="13" fill="#7fbf8f">uh(n), often = in today</text>

    <text x="520" y="468" font-size="13" fill="#ffb000">n/m + vowel, or nn/mm:</text>
    <text x="520" y="488" font-size="13" fill="#ffb000">NOT nasal, n is heard</text>
    <text x="520" y="506" font-size="13" fill="#d8ffd8">bon/bonne  un/une</text>

    <text x="400" y="542" text-anchor="middle" font-size="13" fill="#7fbf8f">French vowels never glide: hold é steady, never "ay-ee".</text>
  </g>
</svg>
