<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Trade-off radar: modular monolith versus microservices</title>
  <desc id="d">A radar chart with six quality attributes scored 0 to 5. Modular monolith: simplicity 5, time to market 4, cost efficiency 4, fault isolation 2, elastic scaling 2, independent deploys 2. Microservices: simplicity 1, time to market 2, cost efficiency 2, fault isolation 4, elastic scaling 5, independent deploys 5. Neither option wins on every axis.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#020a02"/>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">TRADE-OFF RADAR</text>

    <!-- grid rings (r = 36, 72, 108, 144, 180) -->
    <g fill="none" stroke="#0f7a2a" stroke-width="1">
      <polygon points="290,239 321.2,257 321.2,293 290,311 258.8,293 258.8,257"/>
      <polygon points="290,203 352.4,239 352.4,311 290,347 227.6,311 227.6,239"/>
      <polygon points="290,167 383.5,221 383.5,329 290,383 196.5,329 196.5,221"/>
      <polygon points="290,131 414.7,203 414.7,347 290,419 165.3,347 165.3,203"/>
      <polygon points="290,95 445.9,185 445.9,365 290,455 134.1,365 134.1,185" stroke-width="1.5"/>
    </g>
    <!-- axes -->
    <g stroke="#0f7a2a" stroke-width="1">
      <line x1="290" y1="275" x2="290" y2="95"/>
      <line x1="290" y1="275" x2="445.9" y2="185"/>
      <line x1="290" y1="275" x2="445.9" y2="365"/>
      <line x1="290" y1="275" x2="290" y2="455"/>
      <line x1="290" y1="275" x2="134.1" y2="365"/>
      <line x1="290" y1="275" x2="134.1" y2="185"/>
    </g>

    <!-- modular monolith -->
    <polygon points="290,95 414.7,203 414.7,347 290,347 227.6,311 227.6,239" fill="#00ff41" fill-opacity="0.12" stroke="#00ff41" stroke-width="2"/>
    <!-- microservices -->
    <polygon points="290,239 352.4,239 352.4,311 290,419 134.1,365 134.1,185" fill="#ffb000" fill-opacity="0.12" stroke="#ffb000" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- axis labels -->
    <g font-size="14" fill="#d8ffd8">
      <text x="290" y="82" text-anchor="middle">Simplicity</text>
      <text x="458" y="176">Time to</text>
      <text x="458" y="193">market</text>
      <text x="458" y="375">Cost</text>
      <text x="458" y="392">efficiency</text>
      <text x="290" y="480" text-anchor="middle">Fault isolation</text>
      <text x="122" y="375" text-anchor="end">Elastic</text>
      <text x="122" y="392" text-anchor="end">scaling</text>
      <text x="122" y="176" text-anchor="end">Independent</text>
      <text x="122" y="193" text-anchor="end">deploys</text>
    </g>

    <!-- legend and notes -->
    <rect x="570" y="95" width="210" height="330" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <line x1="585" y1="125" x2="615" y2="125" stroke="#00ff41" stroke-width="2.5"/>
    <text x="623" y="130" font-size="13" fill="#00ff41">Modular</text>
    <text x="623" y="147" font-size="13" fill="#00ff41">monolith</text>
    <line x1="585" y1="175" x2="615" y2="175" stroke="#ffb000" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="623" y="180" font-size="13" fill="#ffb000">Microservices</text>
    <g font-size="13" fill="#7fbf8f">
      <text x="585" y="220">Scores 0-5 are</text>
      <text x="585" y="238">illustrative: a</text>
      <text x="585" y="256">small team on a</text>
      <text x="585" y="274">new product.</text>
      <text x="585" y="310" fill="#d8ffd8">No shape wins on</text>
      <text x="585" y="328" fill="#d8ffd8">every axis.</text>
      <text x="585" y="364">Rank attributes</text>
      <text x="585" y="382">first, then pick</text>
      <text x="585" y="400">the matching shape.</text>
    </g>
  </g>
</svg>
