<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Layered versus hexagonal architecture</title>
  <desc id="d">Left: a layered stack of Presentation, Application, Domain and Infrastructure with arrows pointing down to a database, so the domain depends on infrastructure. Right: a hexagon containing use cases and the domain; driving adapters HTTP, CLI and Tests on the left and driven adapters Postgres, Stripe and SMTP on the right all point inward through ports.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#020a02"/>
  <g font-family="'Courier New', monospace">
    <line x1="310" y1="20" x2="310" y2="480" stroke="#0f7a2a" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- LEFT: layered -->
    <text x="160" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#00ff41" filter="url(#glow)">LAYERED</text>
    <g font-size="15" text-anchor="middle">
      <rect x="40" y="65" width="240" height="50" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
      <text x="160" y="95" fill="#d8ffd8">Presentation</text>
      <rect x="40" y="140" width="240" height="50" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
      <text x="160" y="170" fill="#d8ffd8">Application</text>
      <rect x="40" y="215" width="240" height="50" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
      <text x="160" y="245" fill="#ffb000">Domain</text>
      <rect x="40" y="290" width="240" height="50" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
      <text x="160" y="320" fill="#d8ffd8">Infrastructure</text>
      <rect x="90" y="375" width="140" height="44" rx="6" fill="#062b0f" stroke="#7fbf8f" stroke-width="1.5"/>
      <text x="160" y="402" fill="#7fbf8f">Database</text>
    </g>
    <line x1="160" y1="115" x2="160" y2="138" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="160" y1="190" x2="160" y2="213" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="160" y1="265" x2="160" y2="288" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="160" y1="340" x2="160" y2="373" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <text x="160" y="450" text-anchor="middle" font-size="13" fill="#ff4d4d">domain depends on the DB</text>
    <text x="160" y="470" text-anchor="middle" font-size="13" fill="#7fbf8f">dependencies point down</text>

    <!-- RIGHT: hexagonal -->
    <text x="555" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#00ff41" filter="url(#glow)">HEXAGONAL (PORTS AND ADAPTERS)</text>
    <polygon points="670,262 610,366 490,366 430,262 490,158 610,158" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <rect x="495" y="185" width="110" height="36" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="550" y="208" text-anchor="middle" font-size="13" fill="#39e6ff">Use cases</text>
    <rect x="495" y="238" width="110" height="46" rx="6" fill="#020a02" stroke="#ffb000" stroke-width="2"/>
    <text x="550" y="267" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffb000">Domain</text>
    <text x="550" y="318" text-anchor="middle" font-size="13" fill="#7fbf8f">ports =</text>
    <text x="550" y="336" text-anchor="middle" font-size="13" fill="#7fbf8f">interfaces</text>

    <!-- port markers on edges -->
    <g fill="#00ff41">
      <rect x="455" y="203" width="10" height="10"/>
      <rect x="425" y="257" width="10" height="10"/>
      <rect x="455" y="311" width="10" height="10"/>
      <rect x="635" y="203" width="10" height="10"/>
      <rect x="665" y="257" width="10" height="10"/>
      <rect x="635" y="311" width="10" height="10"/>
    </g>

    <!-- driving adapters -->
    <text x="370" y="180" text-anchor="middle" font-size="13" fill="#7fbf8f">driving</text>
    <g font-size="13" text-anchor="middle">
      <rect x="330" y="191" width="80" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="370" y="213" fill="#d8ffd8">HTTP</text>
      <rect x="330" y="245" width="80" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="370" y="267" fill="#d8ffd8">CLI</text>
      <rect x="330" y="299" width="80" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="370" y="321" fill="#d8ffd8">Tests</text>
    </g>
    <line x1="410" y1="208" x2="452" y2="208" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="410" y1="262" x2="422" y2="262" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="410" y1="316" x2="452" y2="316" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>

    <!-- driven adapters -->
    <text x="735" y="180" text-anchor="middle" font-size="13" fill="#7fbf8f">driven</text>
    <g font-size="13" text-anchor="middle">
      <rect x="690" y="191" width="90" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="735" y="213" fill="#d8ffd8">Postgres</text>
      <rect x="690" y="245" width="90" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="735" y="267" fill="#d8ffd8">Stripe</text>
      <rect x="690" y="299" width="90" height="34" rx="6" fill="#062b0f" stroke="#d8ffd8" stroke-width="1.5"/>
      <text x="735" y="321" fill="#d8ffd8">SMTP</text>
    </g>
    <line x1="690" y1="208" x2="648" y2="208" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="690" y1="262" x2="678" y2="262" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="690" y1="316" x2="648" y2="316" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>

    <text x="555" y="410" text-anchor="middle" font-size="13" fill="#d8ffd8">adapters implement or call ports</text>
    <text x="555" y="450" text-anchor="middle" font-size="13" fill="#00ff41">all dependencies point inward</text>
    <text x="555" y="470" text-anchor="middle" font-size="13" fill="#7fbf8f">domain has zero framework imports</text>
  </g>
</svg>
