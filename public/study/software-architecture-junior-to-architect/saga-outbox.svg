<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Transactional outbox feeding an orchestrated saga</title>
  <desc id="d">Top: the order service writes the order row and an outbox row in one local transaction; a relay reads the outbox and publishes to the broker; a saga orchestrator receives the event. Bottom: the orchestrator runs step 1 reserve stock, which succeeds, and step 2 charge card, which fails, so step 3 ship order is never reached. Compensations then run right to left: release stock, then cancel order.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39e6ff"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#020a02"/>
  <g font-family="'Courier New', monospace">
    <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#00ff41" filter="url(#glow)">TRANSACTIONAL OUTBOX + ORCHESTRATED SAGA</text>

    <!-- Order service with local transaction -->
    <rect x="20" y="55" width="300" height="155" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <text x="35" y="78" font-size="15" fill="#d8ffd8">Order service</text>
    <rect x="38" y="92" width="264" height="104" rx="6" fill="none" stroke="#ffb000" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="50" y="112" font-size="13" fill="#ffb000">one local transaction</text>
    <rect x="55" y="128" width="105" height="48" rx="6" fill="#020a02" stroke="#7fbf8f" stroke-width="1.5"/>
    <text x="107" y="157" text-anchor="middle" font-size="14" fill="#d8ffd8">orders</text>
    <rect x="180" y="128" width="105" height="48" rx="6" fill="#020a02" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="232" y="157" text-anchor="middle" font-size="14" fill="#39e6ff">outbox</text>

    <!-- relay, broker, orchestrator -->
    <line x1="285" y1="152" x2="343" y2="137" stroke="#39e6ff" stroke-width="2" marker-end="url(#arrCyan)"/>
    <text x="340" y="182" font-size="13" fill="#7fbf8f">poll / CDC</text>
    <rect x="345" y="110" width="110" height="50" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="400" y="140" text-anchor="middle" font-size="14" fill="#d8ffd8">Relay</text>
    <line x1="455" y1="135" x2="488" y2="135" stroke="#39e6ff" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="490" y="110" width="110" height="50" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="545" y="140" text-anchor="middle" font-size="14" fill="#d8ffd8">Broker</text>
    <line x1="600" y1="135" x2="638" y2="135" stroke="#39e6ff" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="640" y="110" width="140" height="50" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
    <text x="710" y="140" text-anchor="middle" font-size="14" fill="#ffb000">Orchestrator</text>
    <text x="545" y="92" text-anchor="middle" font-size="13" fill="#39e6ff">OrderPlaced</text>

    <!-- commands down to steps -->
    <path d="M 710 160 L 710 240 L 125 240 L 125 278" fill="none" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="420" y="232" text-anchor="middle" font-size="13" fill="#7fbf8f">commands, one step at a time</text>

    <!-- Happy path row -->
    <rect x="40" y="280" width="170" height="64" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <text x="125" y="306" text-anchor="middle" font-size="14" fill="#00ff41">1 Reserve stock</text>
    <text x="125" y="327" text-anchor="middle" font-size="13" fill="#7fbf8f">Inventory: OK</text>
    <line x1="210" y1="312" x2="238" y2="312" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="240" y="280" width="170" height="64" rx="6" fill="#062b0f" stroke="#ff4d4d" stroke-width="2"/>
    <text x="325" y="306" text-anchor="middle" font-size="14" fill="#ff4d4d">2 Charge card</text>
    <text x="325" y="327" text-anchor="middle" font-size="13" fill="#ff4d4d">Payments: FAILED</text>
    <line x1="410" y1="312" x2="438" y2="312" stroke="#0f7a2a" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="440" y="280" width="170" height="64" rx="6" fill="#020a02" stroke="#0f7a2a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="525" y="306" text-anchor="middle" font-size="14" fill="#7fbf8f">3 Ship order</text>
    <text x="525" y="327" text-anchor="middle" font-size="13" fill="#7fbf8f">never reached</text>

    <!-- Compensation row -->
    <line x1="325" y1="344" x2="325" y2="408" stroke="#ffb000" stroke-width="2" marker-end="url(#arrAmber)"/>
    <text x="335" y="382" font-size="13" fill="#ffb000">compensate</text>
    <rect x="240" y="410" width="170" height="64" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
    <text x="325" y="436" text-anchor="middle" font-size="14" fill="#ffb000">Release stock</text>
    <text x="325" y="457" text-anchor="middle" font-size="13" fill="#7fbf8f">undoes step 1</text>
    <line x1="240" y1="442" x2="212" y2="442" stroke="#ffb000" stroke-width="2" marker-end="url(#arrAmber)"/>
    <rect x="40" y="410" width="170" height="64" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
    <text x="125" y="436" text-anchor="middle" font-size="14" fill="#ffb000">Cancel order</text>
    <text x="125" y="457" text-anchor="middle" font-size="13" fill="#7fbf8f">final state</text>

    <!-- Legend -->
    <rect x="630" y="280" width="155" height="194" rx="6" fill="none" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="645" y="303" font-size="13" font-weight="bold" fill="#d8ffd8">LEGEND</text>
    <line x1="645" y1="323" x2="675" y2="323" stroke="#00ff41" stroke-width="2"/>
    <text x="683" y="328" font-size="13" fill="#d8ffd8">happy path</text>
    <line x1="645" y1="348" x2="675" y2="348" stroke="#ffb000" stroke-width="2"/>
    <text x="683" y="353" font-size="13" fill="#d8ffd8">compensate</text>
    <line x1="645" y1="373" x2="675" y2="373" stroke="#39e6ff" stroke-width="2"/>
    <text x="683" y="378" font-size="13" fill="#d8ffd8">events</text>
    <text x="645" y="410" font-size="13" fill="#7fbf8f">delivery is</text>
    <text x="645" y="428" font-size="13" fill="#7fbf8f">at-least-once:</text>
    <text x="645" y="446" font-size="13" fill="#7fbf8f">every handler</text>
    <text x="645" y="464" font-size="13" fill="#7fbf8f">is idempotent</text>
    <text x="400" y="505" text-anchor="middle" font-size="13" fill="#7fbf8f">Compensations run in reverse order of the completed steps.</text>
  </g>
</svg>
