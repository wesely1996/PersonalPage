<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Roadmap: 16 weeks and the JLPT levels</title>
  <desc id="d">Top: a 16-week timeline at about two hours a day, with milestones at week 2 (both kana done), week 6 (polite basics and particles), week 10 (plain forms, te-form, N5 grammar) and week 16 (conversational, about 250 kanji, early N4). Bottom: the five JLPT levels from N5 to N1 with approximate CEFR level, kanji count and vocabulary size, with N5 and N4 marked as the scope of this guide.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Roadmap: 16 weeks, then the JLPT ladder</text>
    <text x="400" y="56" text-anchor="middle" font-size="13" fill="#7fbf8f">about 2 hours a day, roughly 220 hours in total</text>

    <line x1="60" y1="112" x2="750" y2="112" stroke="#00ff41" stroke-width="2" marker-end="url(#arr)"/>
    <g fill="#062b0f" stroke="#00ff41" stroke-width="2">
      <circle cx="60" cy="112" r="7"/>
      <circle cx="145" cy="112" r="7"/>
      <circle cx="315" cy="112" r="7"/>
      <circle cx="485" cy="112" r="7"/>
      <circle cx="730" cy="112" r="7" stroke="#ffb000"/>
    </g>
    <g font-size="13" font-weight="bold" fill="#00ff41" text-anchor="middle">
      <text x="60" y="94" text-anchor="start">Wk 0</text>
      <text x="145" y="94">Wk 2</text>
      <text x="315" y="94">Wk 6</text>
      <text x="485" y="94">Wk 10</text>
      <text x="730" y="94" fill="#ffb000">Wk 16</text>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="145" y="142" fill="#d8ffd8">kana done</text>
      <text x="145" y="160" fill="#7fbf8f">92 signs</text>
      <text x="315" y="142" fill="#d8ffd8">polite basics</text>
      <text x="315" y="160" fill="#7fbf8f">masu, particles</text>
      <text x="485" y="142" fill="#d8ffd8">plain forms</text>
      <text x="485" y="160" fill="#7fbf8f">te-form, N5 grammar</text>
      <text x="760" y="142" text-anchor="end" fill="#ffb000">conversational</text>
      <text x="760" y="160" text-anchor="end" fill="#7fbf8f">~250 kanji, early N4</text>
    </g>

    <line x1="40" y1="184" x2="760" y2="184" stroke="#0f7a2a" stroke-width="1.5"/>

    <g font-size="13" font-weight="bold" fill="#7fbf8f">
      <text x="40" y="212">LEVEL</text>
      <text x="120" y="212">~CEFR</text>
      <text x="200" y="212">KANJI</text>
      <text x="290" y="212">WORDS</text>
      <text x="380" y="212">VOCABULARY SIZE</text>
    </g>

    <!-- N1 .. N5 rows -->
    <g fill="#062b0f" stroke-width="1.5">
      <rect x="40" y="224" width="60" height="32" rx="6" stroke="#0f7a2a"/>
      <rect x="40" y="266" width="60" height="32" rx="6" stroke="#0f7a2a"/>
      <rect x="40" y="308" width="60" height="32" rx="6" stroke="#0f7a2a"/>
      <rect x="40" y="350" width="60" height="32" rx="6" stroke="#ffb000"/>
      <rect x="40" y="392" width="60" height="32" rx="6" stroke="#00ff41"/>
    </g>
    <g stroke-width="1.5">
      <rect x="380" y="230" width="380" height="20" rx="4" fill="#0f7a2a"/>
      <rect x="380" y="272" width="228" height="20" rx="4" fill="#0f7a2a"/>
      <rect x="380" y="314" width="141" height="20" rx="4" fill="#0f7a2a"/>
      <rect x="380" y="356" width="57" height="20" rx="4" fill="#ffb000"/>
      <rect x="380" y="398" width="30" height="20" rx="4" fill="#00ff41"/>
    </g>
    <g font-size="15" font-weight="bold" text-anchor="middle">
      <text x="70" y="245" fill="#7fbf8f">N1</text>
      <text x="70" y="287" fill="#7fbf8f">N2</text>
      <text x="70" y="329" fill="#7fbf8f">N3</text>
      <text x="70" y="371" fill="#ffb000">N4</text>
      <text x="70" y="413" fill="#00ff41">N5</text>
    </g>
    <g font-size="14" fill="#d8ffd8">
      <text x="120" y="245">C1</text><text x="200" y="245">~2,000</text><text x="290" y="245">~10,000</text>
      <text x="120" y="287">B2</text><text x="200" y="287">~1,000</text><text x="290" y="287">~6,000</text>
      <text x="120" y="329">B1</text><text x="200" y="329">~650</text><text x="290" y="329">~3,700</text>
      <text x="120" y="371" fill="#ffb000">A2</text><text x="200" y="371" fill="#ffb000">~300</text><text x="290" y="371" fill="#ffb000">~1,500</text>
      <text x="120" y="413" fill="#00ff41">A1</text><text x="200" y="413" fill="#00ff41">~100</text><text x="290" y="413" fill="#00ff41">~800</text>
    </g>
    <text x="452" y="371" font-size="13" fill="#ffb000">this guide's target</text>
    <text x="424" y="413" font-size="13" fill="#00ff41">first milestone</text>

    <line x1="40" y1="444" x2="760" y2="444" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="40" y="468" font-size="13" fill="#7fbf8f">Counts are common unofficial estimates: the JLPT stopped publishing lists in 2010.</text>
    <text x="40" y="490" font-size="13" fill="#7fbf8f">Test dates: first Sunday of July and December (many overseas sites: December only).</text>
  </g>
</svg>
