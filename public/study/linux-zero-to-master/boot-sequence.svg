<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">The Linux boot sequence</title>
  <desc id="d">Six stages from power-on to login: UEFI firmware, bootloader such as GRUB or systemd-boot, the kernel, the initramfs, systemd as PID 1, and the default target that brings up the login prompt.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Power button to login prompt</text>

    <g stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)">
      <line x1="165" y1="110" x2="165" y2="132"/>
      <line x1="165" y1="188" x2="165" y2="210"/>
      <line x1="165" y1="266" x2="165" y2="288"/>
      <line x1="165" y1="344" x2="165" y2="366"/>
      <line x1="165" y1="422" x2="165" y2="444"/>
    </g>

    <g font-size="15" font-weight="bold">
      <rect x="40" y="56" width="250" height="54" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="56" y="89" fill="#d8ffd8">1  UEFI firmware</text>
      <rect x="40" y="134" width="250" height="54" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="56" y="167" fill="#d8ffd8">2  Bootloader</text>
      <rect x="40" y="212" width="250" height="54" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
      <text x="56" y="245" fill="#00ff41">3  Linux kernel</text>
      <rect x="40" y="290" width="250" height="54" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
      <text x="56" y="323" fill="#39e6ff">4  initramfs</text>
      <rect x="40" y="368" width="250" height="54" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
      <text x="56" y="401" fill="#ffb000">5  systemd (PID 1)</text>
      <rect x="40" y="446" width="250" height="54" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
      <text x="56" y="479" fill="#d8ffd8">6  Target reached</text>
    </g>

    <g font-size="13">
      <text x="320" y="78" fill="#d8ffd8">POST, hardware init, reads boot entries from NVRAM,</text>
      <text x="320" y="98" fill="#7fbf8f">runs an .efi file from the EFI System Partition</text>

      <text x="320" y="156" fill="#d8ffd8">GRUB 2 or systemd-boot (or a UKI): shows a menu,</text>
      <text x="320" y="176" fill="#7fbf8f">loads vmlinuz + initramfs, passes the kernel cmdline</text>

      <text x="320" y="234" fill="#d8ffd8">decompresses itself, sets up CPUs, memory, scheduler,</text>
      <text x="320" y="254" fill="#7fbf8f">built-in drivers; unpacks initramfs as a temporary root</text>

      <text x="320" y="312" fill="#d8ffd8">loads storage modules, assembles RAID/LVM, unlocks LUKS,</text>
      <text x="320" y="332" fill="#7fbf8f">mounts the real root filesystem, then switch_root</text>

      <text x="320" y="390" fill="#d8ffd8">first userspace process; mounts /etc/fstab entries,</text>
      <text x="320" y="410" fill="#7fbf8f">starts units in parallel following their dependencies</text>

      <text x="320" y="468" fill="#d8ffd8">multi-user.target (servers) or graphical.target</text>
      <text x="320" y="488" fill="#7fbf8f">(desktops): getty or display manager, you log in</text>
    </g>

    <text x="400" y="540" text-anchor="middle" font-size="13" fill="#39e6ff">inspect: systemd-analyze blame | journalctl -b | cat /proc/cmdline</text>
  </g>
</svg>
