<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Process states and signals</title>
  <desc id="d">State machine of a Linux process: created by fork and exec, runnable in the run queue, running on a CPU, sleeping while blocked, stopped by a signal, zombie after exit until the parent calls wait. A table lists the most common signals.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Life of a process (ps STAT letters)</text>

    <!-- row 1 -->
    <rect x="40" y="70" width="160" height="56" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="120" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8ffd8">New</text>
    <text x="120" y="114" text-anchor="middle" font-size="13" fill="#7fbf8f">fork() + exec()</text>

    <rect x="300" y="70" width="180" height="56" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="390" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#00ff41">Runnable (R)</text>
    <text x="390" y="114" text-anchor="middle" font-size="13" fill="#7fbf8f">in the run queue</text>

    <rect x="580" y="70" width="180" height="56" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="2"/>
    <text x="670" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#00ff41">Running (R)</text>
    <text x="670" y="114" text-anchor="middle" font-size="13" fill="#7fbf8f">on a CPU now</text>

    <!-- row 2 -->
    <rect x="40" y="230" width="180" height="56" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <text x="130" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffb000">Stopped (T)</text>
    <text x="130" y="274" text-anchor="middle" font-size="13" fill="#7fbf8f">paused by signal</text>

    <rect x="300" y="230" width="180" height="56" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="390" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#39e6ff">Sleeping (S/D)</text>
    <text x="390" y="274" text-anchor="middle" font-size="13" fill="#7fbf8f">waiting on I/O</text>

    <rect x="580" y="230" width="180" height="56" rx="6" fill="#062b0f" stroke="#ff4d4d" stroke-width="1.5"/>
    <text x="670" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#ff4d4d">Zombie (Z)</text>
    <text x="670" y="274" text-anchor="middle" font-size="13" fill="#7fbf8f">exited, not reaped</text>

    <!-- row 3 -->
    <rect x="580" y="380" width="180" height="56" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="670" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8ffd8">Gone</text>
    <text x="670" y="424" text-anchor="middle" font-size="13" fill="#7fbf8f">entry removed</text>

    <!-- arrows -->
    <line x1="200" y1="98" x2="298" y2="98" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="480" y1="88" x2="578" y2="88" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="529" y="80" text-anchor="middle" font-size="13" fill="#d8ffd8">scheduled</text>
    <line x1="580" y1="110" x2="482" y2="110" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="529" y="143" text-anchor="middle" font-size="13" fill="#d8ffd8">preempted</text>

    <line x1="610" y1="126" x2="462" y2="228" stroke="#39e6ff" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="560" y="190" font-size="13" fill="#39e6ff">blocks</text>
    <line x1="390" y1="230" x2="390" y2="128" stroke="#39e6ff" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="398" y="186" font-size="13" fill="#39e6ff">wakes up</text>

    <line x1="320" y1="126" x2="182" y2="228" stroke="#ffb000" stroke-width="1.5" marker-start="url(#arra)" marker-end="url(#arra)"/>
    <text x="226" y="168" text-anchor="end" font-size="13" fill="#ffb000">Ctrl+Z, SIGSTOP</text>
    <text x="226" y="186" text-anchor="end" font-size="13" fill="#ffb000">SIGCONT, fg, bg</text>

    <line x1="700" y1="126" x2="700" y2="228" stroke="#ff4d4d" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="708" y="182" font-size="13" fill="#ff4d4d">exit()</text>
    <line x1="670" y1="286" x2="670" y2="378" stroke="#ff4d4d" stroke-width="1.5" marker-end="url(#arrr)"/>
    <text x="678" y="336" font-size="13" fill="#d8ffd8">parent wait()</text>

    <!-- signals table -->
    <rect x="40" y="320" width="500" height="180" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="56" y="346" font-size="15" font-weight="bold" fill="#00ff41">Signals you will actually use</text>
    <g font-size="13" fill="#d8ffd8">
      <text x="56" y="374">1   SIGHUP    hangup; daemons often reload config</text>
      <text x="56" y="396">2   SIGINT    Ctrl+C, interrupt</text>
      <text x="56" y="418">15  SIGTERM   polite stop (default of kill)</text>
      <text x="56" y="440" fill="#ff4d4d">9   SIGKILL   instant death, cannot be caught</text>
      <text x="56" y="462">19  SIGSTOP   pause, cannot be caught</text>
      <text x="56" y="484">18  SIGCONT   resume a stopped process</text>
    </g>
  </g>
</svg>
