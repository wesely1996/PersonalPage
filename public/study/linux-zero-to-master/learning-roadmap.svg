<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">Linux learning roadmap by level</title>
  <desc id="d">Six levels from Newcomer to Master, each with the topics it covers: basics and shell, files and permissions, pipes and processes, system administration, scripting and operations, and kernel internals.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">Roadmap: six levels, zero to master</text>

    <g stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)">
      <line x1="95" y1="120" x2="95" y2="134"/>
      <line x1="95" y1="196" x2="95" y2="210"/>
      <line x1="95" y1="272" x2="95" y2="286"/>
      <line x1="95" y1="348" x2="95" y2="362"/>
      <line x1="95" y1="424" x2="95" y2="438"/>
    </g>

    <!-- Level 0 -->
    <rect x="40" y="60" width="110" height="60" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="95" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">LEVEL 0</text>
    <rect x="165" y="60" width="595" height="60" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="180" y="84" font-size="15" font-weight="bold" fill="#00ff41">Newcomer</text>
    <text x="180" y="106" font-size="13" fill="#d8ffd8">what Linux is, getting a box, the shell, the filesystem tree</text>

    <!-- Level 1 -->
    <rect x="40" y="136" width="110" height="60" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="95" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">LEVEL 1</text>
    <rect x="165" y="136" width="595" height="60" rx="6" fill="#062b0f" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="180" y="160" font-size="15" font-weight="bold" fill="#00ff41">Operator</text>
    <text x="180" y="182" font-size="13" fill="#d8ffd8">navigation, files, permissions, users, groups, sudo</text>

    <!-- Level 2 -->
    <rect x="40" y="212" width="110" height="60" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="95" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">LEVEL 2</text>
    <rect x="165" y="212" width="595" height="60" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="180" y="236" font-size="15" font-weight="bold" fill="#00ff41">Power user</text>
    <text x="180" y="258" font-size="13" fill="#d8ffd8">pipes, redirection, grep/sed/awk, find, processes, systemd</text>

    <!-- Level 3 -->
    <rect x="40" y="288" width="110" height="60" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="95" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">LEVEL 3</text>
    <rect x="165" y="288" width="595" height="60" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="180" y="312" font-size="15" font-weight="bold" fill="#00ff41">Sysadmin</text>
    <text x="180" y="334" font-size="13" fill="#d8ffd8">packages, networking, SSH, firewalls, disks, mounts, LVM</text>

    <!-- Level 4 -->
    <rect x="40" y="364" width="110" height="60" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="95" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#d8ffd8">LEVEL 4</text>
    <rect x="165" y="364" width="595" height="60" rx="6" fill="#062b0f" stroke="#39e6ff" stroke-width="1.5"/>
    <text x="180" y="388" font-size="15" font-weight="bold" fill="#39e6ff">Engineer</text>
    <text x="180" y="410" font-size="13" fill="#d8ffd8">bash scripting, cron and timers, logs, performance, hardening</text>

    <!-- Level 5 -->
    <rect x="40" y="440" width="110" height="60" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
    <text x="95" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffb000">LEVEL 5</text>
    <rect x="165" y="440" width="595" height="60" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="2"/>
    <text x="180" y="464" font-size="15" font-weight="bold" fill="#ffb000">Master</text>
    <text x="180" y="486" font-size="13" fill="#d8ffd8">containers, boot, modules, /proc, strace, perf, eBPF, kernel builds</text>

    <text x="400" y="534" text-anchor="middle" font-size="13" fill="#7fbf8f">Each level assumes the one before it. Do the exercises before moving on.</text>
  </g>
</svg>
