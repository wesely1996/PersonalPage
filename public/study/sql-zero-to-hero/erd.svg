<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="t d">
  <title id="t">Entity relationship diagram of the shop schema</title>
  <desc id="d">Five tables: customers, orders, order_items, products and categories. customers 1-to-N orders, orders 1-to-N order_items, products 1-to-N order_items, categories 1-to-N products. categories and customers each reference themselves through parent_id and referred_by.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="#020a02"/>
  <g font-family="'Courier New', monospace">
    <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#00ff41" filter="url(#glow)">SHOP SCHEMA (ERD)</text>

    <!-- customers: x 30..240, y 70..246 -->
    <rect x="30" y="70" width="210" height="176" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="30" y1="102" x2="240" y2="102" stroke="#00ff41" stroke-width="1.5"/>
    <text x="42" y="92" font-size="15" font-weight="bold" fill="#00ff41">customers</text>
    <text x="42" y="124" font-size="13" fill="#ffb000">PK</text><text x="84" y="124" font-size="13" fill="#d8ffd8">customer_id</text>
    <text x="42" y="146" font-size="13" fill="#7fbf8f">UQ</text><text x="84" y="146" font-size="13" fill="#d8ffd8">email</text>
    <text x="84" y="168" font-size="13" fill="#d8ffd8">full_name</text>
    <text x="84" y="190" font-size="13" fill="#d8ffd8">country</text>
    <text x="42" y="212" font-size="13" fill="#39e6ff">FK</text><text x="84" y="212" font-size="13" fill="#d8ffd8">referred_by</text>
    <text x="84" y="234" font-size="13" fill="#d8ffd8">created_at</text>

    <!-- orders: x 290..500, y 70..202 -->
    <rect x="290" y="70" width="210" height="132" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="290" y1="102" x2="500" y2="102" stroke="#00ff41" stroke-width="1.5"/>
    <text x="302" y="92" font-size="15" font-weight="bold" fill="#00ff41">orders</text>
    <text x="302" y="124" font-size="13" fill="#ffb000">PK</text><text x="344" y="124" font-size="13" fill="#d8ffd8">order_id</text>
    <text x="302" y="146" font-size="13" fill="#39e6ff">FK</text><text x="344" y="146" font-size="13" fill="#d8ffd8">customer_id</text>
    <text x="344" y="168" font-size="13" fill="#d8ffd8">status</text>
    <text x="344" y="190" font-size="13" fill="#d8ffd8">ordered_at</text>

    <!-- categories: x 560..770, y 70..180 -->
    <rect x="560" y="70" width="210" height="110" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="560" y1="102" x2="770" y2="102" stroke="#00ff41" stroke-width="1.5"/>
    <text x="572" y="92" font-size="15" font-weight="bold" fill="#00ff41">categories</text>
    <text x="572" y="124" font-size="13" fill="#ffb000">PK</text><text x="614" y="124" font-size="13" fill="#d8ffd8">category_id</text>
    <text x="572" y="146" font-size="13" fill="#7fbf8f">UQ</text><text x="614" y="146" font-size="13" fill="#d8ffd8">name</text>
    <text x="572" y="168" font-size="13" fill="#39e6ff">FK</text><text x="614" y="168" font-size="13" fill="#d8ffd8">parent_id</text>

    <!-- order_items: x 290..500, y 320..452 -->
    <rect x="290" y="320" width="210" height="132" rx="6" fill="#062b0f" stroke="#ffb000" stroke-width="1.5"/>
    <line x1="290" y1="352" x2="500" y2="352" stroke="#ffb000" stroke-width="1.5"/>
    <text x="302" y="342" font-size="15" font-weight="bold" fill="#ffb000">order_items</text>
    <text x="302" y="374" font-size="13" fill="#ffb000">PK,FK</text><text x="352" y="374" font-size="13" fill="#d8ffd8">order_id</text>
    <text x="302" y="396" font-size="13" fill="#ffb000">PK,FK</text><text x="352" y="396" font-size="13" fill="#d8ffd8">product_id</text>
    <text x="352" y="418" font-size="13" fill="#d8ffd8">quantity</text>
    <text x="352" y="440" font-size="13" fill="#d8ffd8">unit_price</text>

    <!-- products: x 560..770, y 320..496 -->
    <rect x="560" y="320" width="210" height="176" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="560" y1="352" x2="770" y2="352" stroke="#00ff41" stroke-width="1.5"/>
    <text x="572" y="342" font-size="15" font-weight="bold" fill="#00ff41">products</text>
    <text x="572" y="374" font-size="13" fill="#ffb000">PK</text><text x="614" y="374" font-size="13" fill="#d8ffd8">product_id</text>
    <text x="572" y="396" font-size="13" fill="#7fbf8f">UQ</text><text x="614" y="396" font-size="13" fill="#d8ffd8">sku</text>
    <text x="614" y="418" font-size="13" fill="#d8ffd8">name</text>
    <text x="572" y="440" font-size="13" fill="#39e6ff">FK</text><text x="614" y="440" font-size="13" fill="#d8ffd8">category_id</text>
    <text x="614" y="462" font-size="13" fill="#d8ffd8">price</text>
    <text x="614" y="484" font-size="13" fill="#d8ffd8">stock</text>

    <!-- relationships -->
    <!-- customers 1 - N orders -->
    <line x1="240" y1="146" x2="288" y2="146" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="246" y="140" font-size="13" fill="#ffb000">1</text>
    <text x="274" y="140" font-size="13" fill="#ffb000">N</text>
    <!-- orders 1 - N order_items -->
    <line x1="395" y1="202" x2="395" y2="318" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="403" y="222" font-size="13" fill="#ffb000">1</text>
    <text x="403" y="310" font-size="13" fill="#ffb000">N</text>
    <!-- products 1 - N order_items -->
    <line x1="560" y1="396" x2="502" y2="396" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="545" y="388" font-size="13" fill="#ffb000">1</text>
    <text x="507" y="388" font-size="13" fill="#ffb000">N</text>
    <!-- categories 1 - N products -->
    <line x1="665" y1="180" x2="665" y2="318" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="673" y="200" font-size="13" fill="#ffb000">1</text>
    <text x="673" y="310" font-size="13" fill="#ffb000">N</text>
    <!-- categories self reference -->
    <path d="M770,120 L788,120 L788,168 L772,168" fill="none" stroke="#39e6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="245" font-size="13" fill="#39e6ff">self-ref</text>
    <text x="690" y="263" font-size="13" fill="#39e6ff">parent_id</text>
    <!-- customers self reference -->
    <path d="M80,246 L80,272 L160,272 L160,248" fill="none" stroke="#39e6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="30" y="296" font-size="13" fill="#39e6ff">self-ref: referred_by</text>

    <!-- legend -->
    <rect x="30" y="330" width="220" height="176" rx="6" fill="none" stroke="#0f7a2a" stroke-width="1.5"/>
    <text x="42" y="354" font-size="14" font-weight="bold" fill="#00ff41">LEGEND</text>
    <text x="42" y="378" font-size="13" fill="#ffb000">PK</text><text x="84" y="378" font-size="13" fill="#7fbf8f">primary key</text>
    <text x="42" y="400" font-size="13" fill="#39e6ff">FK</text><text x="84" y="400" font-size="13" fill="#7fbf8f">foreign key</text>
    <text x="42" y="422" font-size="13" fill="#7fbf8f">UQ</text><text x="84" y="422" font-size="13" fill="#7fbf8f">unique</text>
    <text x="42" y="444" font-size="13" fill="#ffb000">1 -&gt; N</text><text x="100" y="444" font-size="13" fill="#7fbf8f">one-to-many</text>
    <text x="42" y="474" font-size="13" fill="#d8ffd8">order_items = N:M</text>
    <text x="42" y="490" font-size="13" fill="#d8ffd8">orders x products</text>
  </g>
</svg>
