<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" role="img" aria-labelledby="t d">
  <title id="t">Hot partition versus even distribution</title>
  <desc id="d">Two bar charts of load per partition against a dashed per-partition throughput limit. Left: with the partition key set to the event date, all of today's writes land on one partition, which blows past the limit and is throttled while the other partitions sit idle. Right: with the partition key set to the device id, or a date plus random suffix, the same total load is spread evenly and every partition stays under the limit.</desc>
  <rect width="100%" height="100%" fill="#020a02"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Courier New', monospace">
    <text x="400" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#00ff41" filter="url(#glow)">THE HOT PARTITION PROBLEM</text>

    <!-- Bad -->
    <rect x="20" y="70" width="365" height="400" rx="6" fill="#062b0f" stroke="#ff4d4d" stroke-width="1.5"/>
    <text x="202" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#ff4d4d">BAD: PK = event_date</text>
    <text x="202" y="118" text-anchor="middle" font-size="13" fill="#7fbf8f">today's writes all hit one partition</text>
    <line x1="45" y1="360" x2="345" y2="360" stroke="#0f7a2a" stroke-width="2"/>
    <rect x="55" y="340" width="50" height="20" fill="#0f7a2a"/>
    <rect x="130" y="345" width="50" height="15" fill="#0f7a2a"/>
    <rect x="205" y="350" width="50" height="10" fill="#0f7a2a"/>
    <rect x="280" y="152" width="50" height="208" fill="#ff4d4d"/>
    <line x1="45" y1="230" x2="345" y2="230" stroke="#ffb000" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g font-size="13">
      <text x="48" y="222" fill="#ffb000">partition limit</text>
      <text x="305" y="144" text-anchor="middle" font-weight="bold" fill="#ff4d4d">THROTTLED</text>
      <text x="80" y="380" text-anchor="middle" fill="#d8ffd8">09-15</text>
      <text x="155" y="380" text-anchor="middle" fill="#d8ffd8">09-16</text>
      <text x="230" y="380" text-anchor="middle" fill="#d8ffd8">09-17</text>
      <text x="305" y="380" text-anchor="middle" fill="#ffb000">today</text>
      <text x="35" y="412" fill="#d8ffd8">One key gets all the traffic;</text>
      <text x="35" y="432" fill="#d8ffd8">buying more capacity does</text>
      <text x="35" y="452" fill="#d8ffd8">not fix a single hot key.</text>
    </g>

    <!-- Good -->
    <rect x="400" y="70" width="380" height="400" rx="6" fill="#062b0f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="590" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#00ff41">GOOD: PK = device_id</text>
    <text x="590" y="118" text-anchor="middle" font-size="13" fill="#7fbf8f">same load, spread over many keys</text>
    <line x1="425" y1="360" x2="745" y2="360" stroke="#0f7a2a" stroke-width="2"/>
    <rect x="435" y="298" width="50" height="62" fill="#00ff41"/>
    <rect x="510" y="290" width="50" height="70" fill="#00ff41"/>
    <rect x="585" y="302" width="50" height="58" fill="#00ff41"/>
    <rect x="660" y="294" width="50" height="66" fill="#00ff41"/>
    <line x1="425" y1="230" x2="745" y2="230" stroke="#ffb000" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g font-size="13">
      <text x="428" y="222" fill="#ffb000">partition limit</text>
      <text x="460" y="380" text-anchor="middle" fill="#d8ffd8">dev-a</text>
      <text x="535" y="380" text-anchor="middle" fill="#d8ffd8">dev-b</text>
      <text x="610" y="380" text-anchor="middle" fill="#d8ffd8">dev-c</text>
      <text x="685" y="380" text-anchor="middle" fill="#d8ffd8">dev-d</text>
      <text x="415" y="412" fill="#d8ffd8">Even spread: every partition</text>
      <text x="415" y="432" fill="#d8ffd8">stays well under its limit.</text>
      <text x="415" y="452" fill="#7fbf8f">Or: PK = date#rand(0..9)</text>
    </g>
  </g>
</svg>
