<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nikola Veselinović</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages, MIT License
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages is a static file host: a direct request for an
      // Angular route like /PersonalPage/archive/study has no matching
      // file, so GitHub serves this 404 page instead of index.html, and
      // the Angular app (which would normally handle that route client
      // side) never gets to run. This script encodes the requested path
      // into a query string and redirects to index.html, whose paired
      // script (see src/index.html) decodes it back with
      // history.replaceState before Angular Router starts, so the app
      // boots straight into the right route.
      //
      // pathSegmentsToKeep is 1: this is a project page served under
      // https://wesely1996.github.io/PersonalPage/, so the first path
      // segment (PersonalPage) is the site's base, not part of the route.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
